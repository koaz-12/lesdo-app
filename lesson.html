<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LESDO - Lección</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤟</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .breadcrumb { margin-bottom: 1rem; color: #666; }
    .breadcrumb a { color: var(--primary-color); text-decoration: none; }
    
    .lesson-video-container {
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }
    .lesson-video-container video {
      width: 100%;
      max-height: 500px;
    }
    
    .quiz-section {
      background: #f9f9f9;
      padding: 2rem;
      border-radius: 8px;
      margin-top: 2rem;
      border: 1px solid #eee;
    }
    .quiz-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1rem;
    }
    .quiz-option {
      padding: 1rem;
      border: 2px solid #ddd;
      border-radius: 8px;
      background: white;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .quiz-option:hover:not(:disabled) {
      border-color: var(--primary-color);
      background: #f0f7ff;
    }
    .quiz-option.correct {
      background: #e6f4ea;
      border-color: #34a853;
      color: #137333;
    }
    .quiz-option.incorrect {
      background: #fce8e6;
      border-color: #ea4335;
      color: #c5221f;
    }
    .quiz-option:disabled {
      cursor: not-allowed;
    }
    .lesson-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .lesson-card {
      display: flex;
      flex-direction: column;
    }
    .lesson-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 8px 8px 0 0;
    }
    .lesson-card-content {
      padding: 1rem;
      border: 1px solid #ddd;
      border-top: none;
      border-radius: 0 0 8px 8px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .completed-badge {
      display: inline-block;
      background: #34a853;
      color: white;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.8rem;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container navbar__container">
      <a href="dashboard.html" class="navbar__logo">🤟 LESDO</a>
      <div class="navbar__nav">
        <a href="dashboard.html" class="navbar__link">Inicio</a>
        <a href="dictionary.html" class="navbar__link">Diccionario</a>
        <a href="flashcards.html" class="navbar__link">Flashcards</a>
        <a href="certificate.html" class="navbar__link">Certificado</a>
      </div>
      <div class="navbar__user">
        <span class="navbar__username" id="userName"></span>
        <button class="btn btn-ghost btn-sm" id="btnLogout">Salir</button>
      </div>
    </div>
  </nav>

  <main class="main-content">
    <div class="container" id="contentArea">
      <div class="spinner"></div>
    </div>
  </main>

  <div class="toast" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/lesson.js"></script>
</body>
</html>
