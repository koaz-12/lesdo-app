<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F4F6"/>
    </linearGradient>
    <linearGradient id="skin_D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDFC4"/>
      <stop offset="100%" stop-color="#F0B58D"/>
    </linearGradient>
    <filter id="shadow_D" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0A2463" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="190" height="190" x="5" y="5" rx="24" fill="url(#grad_D)" stroke="#1E88E5" stroke-width="2.5" filter="url(#shadow_D)"/>
  
  <!-- Big Letter Badge -->
  <circle cx="155" cy="45" r="24" fill="#1E88E5"/>
  <text x="155" y="54" font-family="'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">D</text>

  <!-- Hand Graphic Container -->
  <g transform="translate(15, 25)" filter="url(#shadow_D)">
    
        <!-- Wrist -->
        <rect x="45" y="105" width="45" height="30" rx="6" fill='url(#skin_D)' stroke='#2D3748' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/>
        <!-- Index Extended Up -->
        <rect x="40" y="10" width="15" height="100" rx="7" fill='url(#skin_D)' stroke='#2D3748' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/>
        <!-- Circle with other fingers and thumb -->
        <ellipse cx="75" cy="80" rx="22" ry="25" fill='url(#skin_D)' stroke='#2D3748' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/>
        <circle cx="75" cy="80" r="10" fill="#FFFFFF" stroke="#2D3748" stroke-width="2"/>
        
  </g>

  <!-- Title Bottom Tag -->
  <rect x="25" y="152" width="150" height="26" rx="13" fill="#0A2463"/>
  <text x="100" y="169" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">LESDO • D</text>
</svg>