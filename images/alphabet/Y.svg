<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_Y" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F4F6"/>
    </linearGradient>
    <linearGradient id="skin_Y" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDFC4"/>
      <stop offset="100%" stop-color="#F0B58D"/>
    </linearGradient>
    <filter id="shadow_Y" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0A2463" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="190" height="190" x="5" y="5" rx="24" fill="url(#grad_Y)" stroke="#1E88E5" stroke-width="2.5" filter="url(#shadow_Y)"/>
  
  <!-- Big Letter Badge -->
  <circle cx="155" cy="45" r="24" fill="#1E88E5"/>
  <text x="155" y="54" font-family="'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">Y</text>

  <!-- Hand Graphic Container -->
  <g transform="translate(15, 25)" filter="url(#shadow_Y)">
    
        <!-- Wrist -->
        <rect x="45" y="105" width="45" height="30" rx="6" fill='url(#skin_Y)' stroke='#2D3748' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/>
        <!-- Fist Body -->
        <rect x="40" y="55" width="50" height="50" rx="14" fill='url(#skin_Y)' stroke='#2D3748' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/>
        <!-- Thumb Left -->
        <path d="M 40 70 L 15 50 C 8 45, 18 35, 25 40 L 45 60 Z" fill='url(#skin_Y)' stroke='#2D3748' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/>
        <!-- Pinky Right (Shaka) -->
        <path d="M 85 70 L 110 50 C 118 45, 108 35, 100 40 L 80 60 Z" fill='url(#skin_Y)' stroke='#2D3748' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/>
        
  </g>

  <!-- Title Bottom Tag -->
  <rect x="25" y="152" width="150" height="26" rx="13" fill="#0A2463"/>
  <text x="100" y="169" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">LESDO • Y</text>
</svg>