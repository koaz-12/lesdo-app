<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_B" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F4F6"/>
    </linearGradient>
    <linearGradient id="skin_B" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDFC4"/>
      <stop offset="100%" stop-color="#F0B58D"/>
    </linearGradient>
    <filter id="shadow_B" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0A2463" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="190" height="190" x="5" y="5" rx="24" fill="url(#grad_B)" stroke="#1E88E5" stroke-width="2.5" filter="url(#shadow_B)"/>
  
  <!-- Big Letter Badge -->
  <circle cx="155" cy="45" r="24" fill="#1E88E5"/>
  <text x="155" y="54" font-family="'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">B</text>

  <!-- Hand Graphic Container -->
  <g transform="translate(15, 25)" filter="url(#shadow_B)">
    
        <!-- Wrist -->
        <rect x="45" y="105" width="45" height="30" rx="6" fill='url(#skin_B)' stroke='#2D3748' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/>
        <!-- 4 Extended Fingers -->
        <rect x="38" y="15" width="13" height="95" rx="6" fill='url(#skin_B)' stroke='#2D3748' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/>
        <rect x="52" y="10" width="13" height="100" rx="6" fill='url(#skin_B)' stroke='#2D3748' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/>
        <rect x="66" y="12" width="13" height="98" rx="6" fill='url(#skin_B)' stroke='#2D3748' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/>
        <rect x="80" y="20" width="13" height="90" rx="6" fill='url(#skin_B)' stroke='#2D3748' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/>
        <!-- Thumb Folded In Front -->
        <path d="M 35 85 C 45 75, 65 75, 75 85 C 65 95, 45 95, 35 85 Z" fill='url(#skin_B)' stroke='#2D3748' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/>
        
  </g>

  <!-- Title Bottom Tag -->
  <rect x="25" y="152" width="150" height="26" rx="13" fill="#0A2463"/>
  <text x="100" y="169" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">LESDO • B</text>
</svg>