<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_W" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F4F6"/>
    </linearGradient>
    <linearGradient id="skin_W" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDFC4"/>
      <stop offset="100%" stop-color="#F0B58D"/>
    </linearGradient>
    <filter id="shadow_W" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0A2463" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="190" height="190" x="5" y="5" rx="24" fill="url(#grad_W)" stroke="#1E88E5" stroke-width="2.5" filter="url(#shadow_W)"/>
  
  <!-- Big Letter Badge -->
  <circle cx="155" cy="45" r="24" fill="#1E88E5"/>
  <text x="155" y="54" font-family="'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">W</text>

  <!-- Hand Graphic Container -->
  <g transform="translate(15, 25)" filter="url(#shadow_W)">
    
        <!-- Wrist -->
        <rect x="45" y="105" width="45" height="30" rx="6" fill='url(#skin_W)' stroke='#2D3748' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/>
        <!-- 3 Fingers in W shape -->
        <g transform="rotate(-18 45 60)">
          <rect x="35" y="10" width="14" height="95" rx="7" fill='url(#skin_W)' stroke='#2D3748' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/>
        </g>
        <rect x="58" y="8" width="14" height="98" rx="7" fill='url(#skin_W)' stroke='#2D3748' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/>
        <g transform="rotate(18 80 60)">
          <rect x="75" y="10" width="14" height="95" rx="7" fill='url(#skin_W)' stroke='#2D3748' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/>
        </g>
        <path d="M 35 80 C 50 70, 80 70, 85 90 Z" fill='url(#skin_W)' stroke='#2D3748' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/>
        
  </g>

  <!-- Title Bottom Tag -->
  <rect x="25" y="152" width="150" height="26" rx="13" fill="#0A2463"/>
  <text x="100" y="169" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">LESDO • W</text>
</svg>